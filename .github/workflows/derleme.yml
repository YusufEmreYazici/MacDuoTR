name: derleme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  derle:
    name: macOS · Swift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Araç zinciri
        run: swift --version
      - name: Derle
        run: swift build -c release
